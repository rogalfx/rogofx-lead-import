name: Nightly lead import

on:
  schedule:
    # Backup only. The morning run is started at 4:30am Chicago by cron-job.org (README,
    # "Starting on time with cron-job.org"): GitHub started this schedule ~8 hours late on
    # 12 and 13 November. A late backup sees the day's limit is reached and stops.
    # 07:37 UTC Monday to Saturday = 1:37am Chicago in winter (CST), 2:37am in summer (CDT).
    - cron: "37 7 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only read the sheet and show what would happen"
        type: boolean
        default: true
      limit:
        description: "Max new contacts this run (blank = daily limit from config.json)"
        type: string
        default: ""
      max_locations:
        description: "Max locations this run (blank = no limit)"
        type: string
        default: ""

# Never run two imports at the same time.
concurrency:
  group: nightly-lead-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    # Nightly runs stay off until the repository variable NIGHTLY_ENABLED is "true",
    # so the schedule can't start while Make is still running. Manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # GitHub's maximum is 360. Apify scrapes are the slow part.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run import
        run: node src/index.js
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LIMIT: ${{ inputs.limit }}
          MAX_LOCATIONS: ${{ inputs.max_locations }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          # Optional: leave unset if a GHL trigger already starts the SMS workflow (as with Make).
          GHL_WORKFLOW_ID: ${{ secrets.GHL_WORKFLOW_ID }}
      # Read-only on GHL. Rewrites the sheet's "Funnel" tab. Never fails the night's import.
      - name: Funnel report
        if: always()
        continue-on-error: true
        run: node src/funnel-run.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
